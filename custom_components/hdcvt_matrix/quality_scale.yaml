# Self-assessment against Home Assistant's integration quality scale.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
#
# This is a custom integration, so no tier is claimed in the manifest. The
# file exists so the gaps are written down rather than rediscovered.

rules:
  # Bronze
  action-setup: exempt
  appropriate-polling: done
  brands:
    status: todo
    comment: |
      Needs a PR to home-assistant/brands. Until then the device shows a
      placeholder icon and CI passes `ignore: brands` to the HACS action.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: exempt
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: todo
  entity-event-setup: exempt
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: 78 tests across the client, config flow and every platform.

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: done
    comment: |
      DHCP only. The matrix answers neither SSDP nor mDNS, verified by
      probing it, so there is nothing faster to hook into.
  discovery-update-info: done
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: exempt
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations:
    status: todo
    comment: Errors are raised with English messages rather than keys.
  icon-translations: todo
  reconfiguration-flow: done
  repair-issues: exempt
  stale-devices: exempt

  # Platinum
  async-dependency: done
  inject-websession:
    status: done
    comment: |
      The client takes a MatrixSession protocol, satisfied by Home
      Assistant's shared aiohttp session.
  strict-typing:
    status: done
    comment: mypy --strict passes over the integration and its tests.
